# Full non-debug Uranus run on CPU with one cubed-sphere face per process.
geometry:
  type: gnomonic-equiangle
  bounds:
    x1min: 2.4973E7
    x1max: 2.5073E7
    x2min_pi: -0.25
    x2max_pi: 0.25
    x3min_pi: -0.25
    x3max_pi: 0.25
  cells:
    nx1: 15
    nx2: 32
    nx3: 32
    nghost: 3

distribute:
  backend: gloo
  layout: cubed-sphere
  nb2: 1
  nb3: 1
  blocks_per_process: 1
  verbose: false

dynamics:
  equation-of-state:
    type: ideal-gas
    gammad: 1.4
    weight: 2.2e-3
    density-floor: 1.e-10
    pressure-floor: 1.e-10
    tracer-floor: 1.e-12
    limiter: false
    max-iter: 30
    ftol: 1.e-6
  vertical-projection:
    type: temperature
    pressure-margin: 1.e-6
  reconstruct:
    vertical: { type: weno5, scale: true, shock: true }
    horizontal: { type: weno5, scale: true, shock: true }
  riemann-solver:
    type: hllc

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: custom
    x2-outer: custom
    x3-inner: custom
    x3-outer: custom

integration:
  type: rk3
  cfl: 0.9
  implicit-scheme: 9
  nlim: 99999
  tlim: 1.0e10
  ncycle_out: 10

outputs:
  - type: restart
    dt: 1.0e10
  - type: netcdf
    variables: [prim, uov]
    dt: 1.0e5

forcing:
  const-gravity:
    grav1: -9.19
  coriolis:
    type: xyz
    omega1: 1.0119154e-4

problem:
  Ts: 90.
  Tmin: 60.
  Ps: 1.5e5
  xH2O: 0.1
  stellar_flux_nadir: 3.72
  substellar_lon_deg: 90.0
  substellar_lat_deg: 0.0
  forcing_depth_bottom: 1
  forcing_depth_top: 1
  sponge_tau: 3.5e6
  spongeheight: 20.e3
  tempmean: 75.00289916992188
  tempstd: 27.691502481761777
  heatthr: 1.0000000000000001e-07
  heatsf: 1.888831377029419
  fluxmean: 0.5386345982551575
  fluxstd: 0.2876051746237154
  umumean: 0.5454646944999695
  umustd: 0.2685113709805717
  rt_update_cadence: 1.0e5
  tidal_heating_decay_tau: 5.0e5
  modelfile: basemodel_12_19.pt
  syear: 2.5759e9

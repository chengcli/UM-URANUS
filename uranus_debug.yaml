geometry:
  type: gnomonic-equiangle
  bounds:
    x1min: 2.4973E7
    x1max: 2.5073E7
    x2min_pi: -0.25
    x2max_pi: 0.25
    x3min_pi: -0.25
    x3max_pi: 0.25
  cells:
    nx1: 10
    nx2: 10
    nx3: 10
    nghost: 3

distribute:
  backend: nccl
  layout: cubed-sphere
  nb2: 1
  nb3: 1
  blocks_per_process: 6
  verbose: false

dynamics:
  equation-of-state:
    type: ideal-gas
    gammad: 1.4
    weight: 2.2e-3
    density-floor: 1.e-10
    pressure-floor: 1.e-10
    tracer-floor: 1.e-12
    limiter: false
    max-iter: 30
    ftol: 1.e-6
  vertical-projection:
    type: temperature
    pressure-margin: 1.e-6
  reconstruct:
    vertical: { type: weno5, scale: true, shock: true }
    horizontal: { type: weno5, scale: true, shock: true }
  riemann-solver:
    type: hllc

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: custom
    x2-outer: custom
    x3-inner: custom
    x3-outer: custom

integration:
  type: rk3
  cfl: 0.3
  implicit-scheme: 9
  nlim: 10
  tlim: 1.0e5
  ncycle_out: 1

outputs:
  - type: restart
    dt: 1.0e99
  - type: netcdf
    variables: [prim, uov]
    dt: 1.0e99

forcing:
  const-gravity:
    grav1: -9.19
  coriolis:
    type: xyz
    omega1: 1.0119154e-4

problem:
  Ts: 90.
  Tmin: 60.
  Ps: 1.5e5
  xH2O: 0.1
  stellar_flux_nadir: 3.72
  substellar_lon_deg: 90.0
  substellar_lat_deg: 0.0
  forcing_depth_bottom: 1
  forcing_depth_top: 1
  debug_bottom_temp_rate: 1.0e-6
  debug_top_temp_rate: -1.0e-6
  sponge_tau: 3.5e6
  spongeheight: 20.e3
  rt_update_cadence: 1.0e99
  syear: 2.5759e9
